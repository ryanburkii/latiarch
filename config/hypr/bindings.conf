# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = latiarch-launch-browser

bindd = SUPER, return, Terminal, exec, $terminal --working-directory="$(latiarch-cmd-terminal-cwd)"
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, M, Music, exec, latiarch-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, latiarch-launch-editor
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER, G, Signal, exec, latiarch-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER, O, Obsidian, exec, latiarch-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, ChatGPT, exec, latiarch-launch-webapp "https://chatgpt.com"

# Overwrite existing bindings, like putting LatiArch Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, LatiArch menu, exec, latiarch-menu
